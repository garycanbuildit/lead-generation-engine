<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gary's Lead Generation Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        input,
        select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-header h2 {
            color: #333;
            font-size: 1.5rem;
        }

        .export-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .csv-table-container {
            display: none;
            margin-top: 20px;
            overflow-x: auto;
        }

        .csv-table-container.active {
            display: block;
        }

        .csv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .csv-table th,
        .csv-table td {
            padding: 12px;
            text-align: left;
            border: 1px solid #e5e7eb;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .csv-table th {
            background: #f3f4f6;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .csv-table tr:hover {
            background: #f9fafb;
        }

        .lead-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .lead-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .lead-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
        }

        .lead-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .lead-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4b5563;
            font-size: 0.95rem;
            overflow-wrap: anywhere;
            word-break: break-word;
            margin-bottom: 5px;
        }

        .info-item strong {
            color: #1f2937;
        }

        .info-item a {
            color: #667eea;
            text-decoration: none;
        }

        .info-item a:hover {
            text-decoration: underline;
        }

        .social-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .social-link {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .loading-quote {
            font-size: 0.95rem;
            color: #6b7280;
            margin-top: 10px;
            font-style: italic;
            min-height: 1.5rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Gary's Lead Generation Engine</h1>
            <p>Find and enrich business leads with contact data and intro emails</p>
        </div>

        <div class="card">
            <form id="searchForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="query">Business Type</label>
                        <input type="text" id="query" name="query" placeholder="e.g., landscapers, plumbers, dentists"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Houston, TX" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="maxResults">Number of Leads</label>
                        <select id="maxResults" name="maxResults">
                            <option value="5">5 leads</option>
                            <option value="10" selected>10 leads</option>
                            <option value="15">15 leads</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="enrichData">Enrich Data</label>
                        <select id="enrichData" name="enrichData">
                            <option value="true" selected>Yes - Get emails & social media</option>
                            <option value="false">No - Basic info only</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    Generate Leads
                </button>
            </form>

            <div class="error" id="error"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p><strong>Generating leads...</strong></p>
                <div class="loading-quote" id="loadingQuote">Converting coffee into code...</div>
            </div>
        </div>

        <div class="card results" id="results">
            <div class="results-header">
                <h2>📊 Results</h2>
                <button class="export-btn" id="viewTableBtn">📋 View Table</button>
            </div>

            <div class="csv-table-container" id="csvTableContainer">
                <h3 style="margin-bottom: 15px;">📊 Data Table</h3>
                <div style="overflow-x: auto;">
                    <table class="csv-table" id="csvTable"></table>
                </div>
            </div>

            <div class="stats" id="stats"></div>
            <div id="leadsList"></div>
        </div>
    </div>

    <script>
        let currentLeads = null;
        let quoteInterval = null;

        const quotes = [
            "Reticulating splines.",
            "Loading... Please do not disturb the AI while it questions its existence.",
            "Engaging the cerebral matrix.",
            "Computing... [insert 90s modem noise].",
            "Feeding the hamster in the server rack.",
            "Wait, I need to consult the Oracle of Silicon.",
            "Applying maximum overclock to my last remaining brain cell.",
            "Simulating a universe where this works.",
            "Releasing the bugs into the wild.",
            "Compiling... because I hate myself, apparently.",
            "Translating human idiocy into machine logic.",
            "Semicolon placement simulation in progress.",
            "Building... hope the compiler doesn't throw a tantrum.",
            "Converting coffee into code.",
            "Trying to align the CSS stars.",
            "Engaging warp drive!",
            "Launching... hopefully not into a black hole.",
            "Powering up the mothership.",
            "Initiating protocol... oh, never mind, it crashed.",
            "Starting the program. Cross your circuits!",
            "Ignition sequence initiated. Godspeed."
        ];

        function startQuoteRotation() {
            const quoteEl = document.getElementById('loadingQuote');
            let index = 0;

            // Initial quote
            quoteEl.textContent = quotes[Math.floor(Math.random() * quotes.length)];

            quoteInterval = setInterval(() => {
                index = Math.floor(Math.random() * quotes.length);
                // Simple fade effect by re-triggering animation
                quoteEl.style.animation = 'none';
                quoteEl.offsetHeight; // Trigger reflow
                quoteEl.style.animation = null;
                quoteEl.textContent = quotes[index];
            }, 5000);
        }

        function stopQuoteRotation() {
            if (quoteInterval) {
                clearInterval(quoteInterval);
                quoteInterval = null;
            }
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = {
                query: formData.get('query'),
                location: formData.get('location'),
                maxResults: parseInt(formData.get('maxResults')),
                enrichData: formData.get('enrichData') === 'true'
            };

            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('error').classList.remove('active');
            document.getElementById('submitBtn').disabled = true;
            startQuoteRotation();

            try {
                // Call API
                const response = await fetch('/api/generate-leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'Failed to generate leads');
                }

                const result = await response.json();
                currentLeads = result;
                displayResults(result);

            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').classList.add('active');
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('submitBtn').disabled = false;
                stopQuoteRotation();
            }
        });

        function displayResults(data) {
            const leads = data.leads || [];

            // Show stats
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-value">${leads.length}</div>
                    <div class="stat-label">Total Leads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${leads.filter(l => l.emails && l.emails.length > 0).length}</div>
                    <div class="stat-label">With Email</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${(leads.reduce((sum, l) => sum + parseFloat(l.rating || 0), 0) / leads.length).toFixed(1)}</div>
                    <div class="stat-label">Avg Rating</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;

            // Show leads
            const leadsHtml = leads.map(lead => `
                <div class="lead-card">
                    <div class="lead-header">
                        <div class="lead-name">${lead.name}</div>
                        <div class="lead-score">${lead.lead_score || 1}/5</div>
                    </div>
                    <div class="lead-info">
                        <div class="info-item">
                            <strong>📞</strong> ${lead.phone}
                        </div>
                        <div class="info-item">
                            <strong>⭐</strong> ${lead.rating} stars (${lead.reviews} reviews)
                        </div>
                        ${lead.website && lead.website !== 'N/A' ? `
                        <div class="info-item">
                            <strong>🌐</strong> <a href="${lead.website}" target="_blank">Website</a>
                        </div>
                        ` : ''}
                        ${lead.emails && lead.emails.length > 0 ? `
                        <div class="info-item">
                            <strong>📧</strong> ${lead.emails.slice(0, 3).join(', ')}${lead.emails.length > 3 ? ` (+${lead.emails.length - 3} more)` : ''}
                        </div>
                        ` : ''}
                    </div>
                    <div class="info-item">
                        <strong>📍</strong> ${lead.address}
                    </div>
                    ${hasSocialMedia(lead) ? `
                    <div class="social-links">
                        ${lead.social_media?.facebook ? `<a href="${lead.social_media.facebook}" target="_blank" class="social-link">Facebook</a>` : ''}
                        ${lead.social_media?.instagram ? `<a href="${lead.social_media.instagram}" target="_blank" class="social-link">Instagram</a>` : ''}
                        ${lead.social_media?.tiktok ? `<a href="${lead.social_media.tiktok}" target="_blank" class="social-link">TikTok</a>` : ''}
                        ${lead.social_media?.twitter ? `<a href="${lead.social_media.twitter}" target="_blank" class="social-link">X</a>` : ''}
                        ${lead.social_media?.linkedin ? `<a href="${lead.social_media.linkedin}" target="_blank" class="social-link">LinkedIn</a>` : ''}
                    </div>
                    ` : ''}
                </div>
            `).join('');

            document.getElementById('leadsList').innerHTML = leadsHtml;
            document.getElementById('results').classList.add('active');
        }

        function hasSocialMedia(lead) {
            const social = lead.social_media || {};
            return social.facebook || social.instagram || social.tiktok || social.twitter || social.linkedin;
        }

        // View Table
        document.getElementById('viewTableBtn').addEventListener('click', () => {
            if (!currentLeads) return;

            const container = document.getElementById('csvTableContainer');
            const isVisible = container.classList.contains('active');

            if (isVisible) {
                container.classList.remove('active');
                document.getElementById('viewTableBtn').textContent = '📋 View Table';
            } else {
                displayTable(currentLeads.leads);
                container.classList.add('active');
                document.getElementById('viewTableBtn').textContent = '✖️ Hide Table';
                container.scrollIntoView({ behavior: 'smooth' });
            }
        });

        function displayTable(leads) {
            const table = document.getElementById('csvTable');
            const headers = [
                'Name', 'Score', 'Website', 'Email', 'Phone', 'Address',
                'Rating', 'Reviews', 'Facebook', 'Instagram', 'TikTok', 'X', 'LinkedIn'
            ];

            let html = '<thead><tr>';
            headers.forEach(h => {
                html += `<th>${h}</th>`;
            });
            html += '</tr></thead><tbody>';

            leads.forEach(lead => {
                const social = lead.social_media || {};
                const emails = (lead.emails || []).slice(0, 3).join(', ');

                html += '<tr>';
                html += `<td>${lead.name || ''}</td>`;
                html += `<td>${lead.lead_score || 'N/A'}</td>`;
                html += `<td>${lead.website && lead.website !== 'N/A' ? `<a href="${lead.website}" target="_blank">Link</a>` : ''}</td>`;
                html += `<td>${emails}</td>`;
                html += `<td>${lead.phone || ''}</td>`;
                html += `<td>${lead.address || ''}</td>`;
                html += `<td>${lead.rating || ''}</td>`;
                html += `<td>${lead.reviews || ''}</td>`;
                html += `<td>${social.facebook ? `<a href="${social.facebook}" target="_blank">Link</a>` : ''}</td>`;
                html += `<td>${social.instagram ? `<a href="${social.instagram}" target="_blank">Link</a>` : ''}</td>`;
                html += `<td>${social.tiktok ? `<a href="${social.tiktok}" target="_blank">Link</a>` : ''}</td>`;
                html += `<td>${social.twitter ? `<a href="${social.twitter}" target="_blank">Link</a>` : ''}</td>`;
                html += `<td>${social.linkedin ? `<a href="${social.linkedin}" target="_blank">Link</a>` : ''}</td>`;
                html += '</tr>';
            });

            html += '</tbody>';
            table.innerHTML = html;
        }



        // Old Google Sheets export code (keeping for reference, but not used)
        /*
        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!currentLeads) return;

            document.getElementById('exportBtn').disabled = true;
            document.getElementById('exportBtn').textContent = 'Exporting...';

            try {
                const response = await fetch('/api/export-to-sheets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(currentLeads)
                });

                if (!response.ok) {
                    throw new Error('Failed to export to Google Sheets');
                }

                const result = await response.json();
                const readOnlyUrl = result.url.replace('/edit', '') + '/view';
                window.open(readOnlyUrl, '_blank');
                alert('✅ Exported to Google Sheets! (Read-only view)');

            } catch (error) {
                alert('❌ Export failed: ' + error.message);
            } finally {
                document.getElementById('exportBtn').disabled = false;
                document.getElementById('exportBtn').textContent = 'Export to Google Sheets';
            }
        });
        */
    </script>
</body>

</html>
